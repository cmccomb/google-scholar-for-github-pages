name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jekyll: ['3.10.0', '4.3.4', '4.4.1']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - run: gem install "jekyll:${{ matrix.jekyll }}" 'jekyll-theme-tactile:0.2.0' 'kramdown-parser-gfm:1.1.0'
      - run: ruby tests/test_publications.rb
      - run: git diff --exit-code -- coverage/liquid-branches.json coverage/liquid-branches-badge.json
      - run: jekyll build
